<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>🍄 超级马里奥 · 像素平台跳跃</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="480"></canvas>

    <!-- HUD -->
    <div class="hud" id="hud">
      <div class="hud__item"><span class="hud__label">得分</span><span id="hud-score">000000</span></div>
      <div class="hud__item"><span class="hud__label">最高</span><span id="hud-best">000000</span></div>
      <div class="hud__item"><span class="hud__label">🪙</span><span id="hud-coins">x00</span></div>
      <div class="hud__item"><span class="hud__label">关卡</span><span id="hud-level">1-1</span></div>
      <div class="hud__item"><span class="hud__label">生命</span><span id="hud-lives">❤❤❤</span></div>
      <div class="hud__item"><span class="hud__label">时间</span><span id="hud-time">300</span></div>
    </div>

    <!-- 标题覆盖层 -->
    <div class="overlay" id="overlay-title">
      <div class="panel">
        <h1 class="panel__title">🍄 超级马里奥</h1>
        <p class="panel__sub">像素平台跳跃 · 3 大关卡</p>
        <ul class="panel__help">
          <li><b>移动</b>：← → 或 A / D　<b>跳跃</b>：↑ / W / 空格</li>
          <li><b>火球</b>：X 键（需先吃到火焰花 🌸）</li>
          <li><b>踩敌人</b>得分 · <b>金币</b>加分 · 抵达 <b>旗子</b> 通关</li>
          <li>🍄 变大　🌸 火焰　⭐ 无敌星</li>
        </ul>
        <button class="btn" id="btn-start">开始游戏</button>
        <p class="panel__hint">按 Enter 或点击开始</p>
        <div class="leaderboard">
          <h2 class="leaderboard__title">🏆 本地排行榜</h2>
          <ol class="leaderboard__list" id="lb-list"></ol>
        </div>
      </div>
    </div>

    <!-- 通关覆盖层 -->
    <div class="overlay hidden" id="overlay-win">
      <div class="panel">
        <h1 class="panel__title">🎉 全部通关！</h1>
        <p class="panel__sub">恭喜你通关所有关卡！</p>
        <p class="panel__score">本局得分：<b id="win-score">0</b></p>
        <p class="panel__score">历史最高：<b id="win-best">0</b></p>
        <div class="leaderboard">
          <h2 class="leaderboard__title">🏆 排行榜</h2>
          <ol class="leaderboard__list" id="lb-list-win"></ol>
        </div>
        <button class="btn" id="btn-restart-win">再玩一次</button>
      </div>
    </div>

    <!-- 游戏结束覆盖层 -->
    <div class="overlay hidden" id="overlay-over">
      <div class="panel">
        <h1 class="panel__title">💀 游戏结束</h1>
        <p class="panel__score">本局得分：<b id="over-score">0</b></p>
        <p class="panel__score">历史最高：<b id="over-best">0</b></p>
        <button class="btn" id="btn-restart-over">重新开始</button>
      </div>
    </div>

    <!-- 移动端触控 -->
    <div class="touch-controls" id="touch-controls">
      <div class="touch-controls__left">
        <button class="tbtn" id="btn-left" aria-label="向左">◀</button>
        <button class="tbtn" id="btn-right" aria-label="向右">▶</button>
      </div>
      <div class="touch-controls__right">
        <button class="tbtn tbtn--fire" id="btn-fire" aria-label="火球">🔥</button>
        <button class="tbtn tbtn--jump" id="btn-jump" aria-label="跳跃">A</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
